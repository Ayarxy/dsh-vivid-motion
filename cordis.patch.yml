# ============================================================================
# dsh-vivid-motion —— DSH bundle patch（聚合包）
# ============================================================================
# 本包是空壳聚合包（profile bundle）：自身不含功能代码，靠下面的 insert 行
# 把各个组件包挂进 Web profile 的配置树。每个组件是 packages/ 下的独立包，
# 组件行的显示名取自各组件包自己的 package.json / locale 元数据。
#
# 组件以裸包名引用（如 dsh-click-spark），靠 dependencies 里的 file: 依赖
# 和 npm install 生成的 node_modules 符号链接解析——clone 本仓库后必须先
# 在聚合包目录跑一次 npm install。
#
# 安装方式（二选一）：
#   1) Desktop 应用：设置 → 插件 → 添加插件 → 填本目录绝对路径
#   2) 命令行：dsh plugin --profile desktop add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: dsh-click-spark
      name: dsh-click-spark
    - id: dsh-copy-toast
      name: dsh-copy-toast
    - id: dsh-smooth-caret
      name: dsh-smooth-caret
    - id: dsh-reasoning-slider
      name: dsh-reasoning-slider
    - id: dsh-ui-transitions
      name: dsh-ui-transitions
